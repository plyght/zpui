name: CI

on:
  push:
  pull_request:

env:
  LINUX_DEPS: >-
    libvulkan-dev mesa-vulkan-drivers glslc
    libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev
    libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcursor-dev libxi-dev libxrandr-dev
    libfreetype-dev libharfbuzz-dev libfontconfig-dev fonts-inter fonts-jetbrains-mono fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - run: zig build test --summary all
      # Apple Silicon runners expose no Metal device, so macOS only builds here; renders run on Intel below.
      - run: zig build --summary all
      # The macOS AppKit/CoreText backend must keep compiling from non-macOS hosts (object only, no SDK).
      - name: Cross-compile macOS platform backend (mac-check)
        if: runner.os == 'Linux'
        run: |
          zig build mac-check -Dtarget=aarch64-macos --summary all
          zig build mac-check -Dtarget=x86_64-macos --summary all

  # Renders the showcase scene with the real GPU backend and uploads the PNG.
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: vulkan-lavapipe
          - os: macos-15-intel
            backend: metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - run: zig build render-test --summary all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.backend }}
          path: zig-out/*.png
          if-no-files-found: warn

  # macOS platform backend smoke test: opens a real NSWindow (blurred, transparent
  # titlebar), renders 30 display-link frames through Metal, writes
  # zig-out/mac-window-offscreen.png (offscreen render of the same scene, pixel-checked)
  # and zig-out/mac-window.png (window capture, best effort), then exits.
  # Intel runner: Apple Silicon runners expose no Metal device.
  mac-window:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build (all macOS artifacts, including mac-window)
        run: zig build --summary all
      - name: Smoke test mac-window (30 frames)
        timeout-minutes: 5
        env:
          ZPUI_SMOKE_FRAMES: "30"
        # On failure the demo prints FAIL: <reason> (no frames / blank render / openWindow error).
        run: ./zig-out/bin/mac-window
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-window-smoke
          path: zig-out/mac-window*.png
          if-no-files-found: warn

  # Real-app smoke test (macOS, Metal): builds the zeron desktop client in
  # ReleaseSafe and runs it from the checked-in reference fixtures (no engine)
  # in dark and light appearance. `--smoke-frames 60` renders 60 frames, captures
  # the window (CGWindowListCreateImage) to zig-out/zeron-macos[-light].png and
  # exits 0, or prints `FAIL: zeron smoke: <reason>` (no frames within the
  # watchdog, capture error, blank image) and exits 1.
  # Intel runner: Apple Silicon runners expose no Metal device.
  zeron-app:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build zeron (ReleaseSafe)
        run: zig build zeron -Doptimize=ReleaseSafe --summary all
      - name: Smoke test zeron, dark (60 frames, reference fixtures)
        timeout-minutes: 5
        run: ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --dark
      - name: Smoke test zeron, light (60 frames, reference fixtures)
        timeout-minutes: 5
        run: ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --light
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeron-macos
          path: zig-out/zeron-macos*.png
          if-no-files-found: warn

  # Same smoke test on Linux: Xvfb (X11, server decorations) + Vulkan lavapipe.
  # The window is captured with ImageMagick `import` (zig-out/zeron-linux[-light].png).
  # Also packages the Linux tarball (`zig build zeron-dist`).
  zeron-app-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install Linux dependencies (+ Xvfb, ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS xvfb xauth imagemagick
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - name: Build zeron (ReleaseSafe)
        run: zig build zeron -Doptimize=ReleaseSafe --summary all
      - name: Smoke test zeron, dark (60 frames, reference fixtures, Xvfb + lavapipe)
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1600x1000x24 -nolisten tcp" ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --dark
      - name: Smoke test zeron, light (60 frames, reference fixtures, Xvfb + lavapipe)
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1600x1000x24 -nolisten tcp" ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --light
      - name: Package Linux tarball (zig build zeron-dist)
        run: zig build zeron-dist -Doptimize=ReleaseSafe --summary all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeron-linux
          path: zig-out/zeron-linux*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: zeron-linux-dist
          path: zig-out/zeron-*-linux-*.tar.gz
          if-no-files-found: error

  # macOS packaging: Zeron.app with a universal (arm64 + x86_64) binary, built
  # per arch then merged with lipo by `zig build zeron-app-bundle`. Apple Silicon
  # has no Metal device on CI, so the bundle is checked structurally and by
  # running its binary (`zeron headless` must refuse with exit 2: proves the
  # arm64 slice loads its frameworks), not rendered.
  zeron-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build Zeron.app (x86_64, then aarch64 + lipo → universal)
        run: |
          zig build zeron-app-bundle -Doptimize=ReleaseSafe -Dtarget=x86_64-macos -Dmacos-sdk="$(xcrun --sdk macosx --show-sdk-path)" --summary all
          zig build zeron-app-bundle -Doptimize=ReleaseSafe -Dtarget=aarch64-macos -Dmacos-sdk="$(xcrun --sdk macosx --show-sdk-path)" --summary all
      - name: Verify bundle
        run: |
          app=zig-out/Zeron.app
          plutil -lint "$app/Contents/Info.plist"
          echo "bundle id: $(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")"
          echo "version:   $(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          test -s "$app/Contents/Resources/zeron.icns" || { echo "FAIL: zeron.icns missing"; exit 1; }
          lipo -info "$app/Contents/MacOS/zeron"
          for a in arm64 x86_64; do
            lipo "$app/Contents/MacOS/zeron" -verify_arch "$a" || { echo "FAIL: universal binary lacks $a"; exit 1; }
          done
          codesign --verify --verbose=2 "$app"
          set +e
          "$app/Contents/MacOS/zeron" headless; code=$?
          set -e
          if [ "$code" != 2 ]; then echo "FAIL: bundled zeron did not start (exit $code; expected the 'not the engine' refusal, 2)"; exit 1; fi
          echo "bundled binary starts (refused 'headless' as expected)"
      - name: Zip Zeron.app
        run: ditto -c -k --keepParent zig-out/Zeron.app zig-out/Zeron-macos-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Zeron-macos-app
          path: zig-out/Zeron-macos-app.zip
          if-no-files-found: error
