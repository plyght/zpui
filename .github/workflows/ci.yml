name: CI

on:
  push:
  pull_request:

env:
  LINUX_DEPS: >-
    libvulkan-dev mesa-vulkan-drivers glslc
    libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev
    libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcursor-dev libxi-dev libxrandr-dev
    libfreetype-dev libharfbuzz-dev libfontconfig-dev fonts-inter fonts-jetbrains-mono fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - run: zig build test --summary all
      # Apple Silicon runners expose no Metal device, so macOS only builds here; renders run on Intel below.
      - run: zig build --summary all
      # The macOS AppKit/CoreText backend must keep compiling from non-macOS hosts (object only, no SDK).
      - name: Cross-compile macOS platform backend (mac-check)
        if: runner.os == 'Linux'
        run: |
          zig build mac-check -Dtarget=aarch64-macos --summary all
          zig build mac-check -Dtarget=x86_64-macos --summary all

  # Renders the showcase scene with the real GPU backend and uploads the PNG.
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: vulkan-lavapipe
          - os: macos-15-intel
            backend: metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - run: zig build render-test --summary all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.backend }}
          path: zig-out/*.png
          if-no-files-found: warn

  # macOS platform backend smoke test: opens a real NSWindow (blurred, transparent
  # titlebar), renders 30 display-link frames through Metal, writes
  # zig-out/mac-window-offscreen.png (offscreen render of the same scene, pixel-checked)
  # and zig-out/mac-window.png (window capture, best effort), then exits.
  # Intel runner: Apple Silicon runners expose no Metal device.
  mac-window:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build (all macOS artifacts, including mac-window)
        run: zig build --summary all
      - name: Smoke test mac-window (30 frames)
        timeout-minutes: 5
        env:
          ZPUI_SMOKE_FRAMES: "30"
        # On failure the demo prints FAIL: <reason> (no frames / blank render / openWindow error).
        run: ./zig-out/bin/mac-window
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-window-smoke
          path: zig-out/mac-window*.png
          if-no-files-found: warn

  # Real-app smoke test (macOS, Metal): builds the zeron desktop client in
  # ReleaseSafe and runs it from the checked-in reference fixtures (no engine)
  # in dark and light appearance. `--smoke-frames 60` renders 60 frames, captures
  # the window (CGWindowListCreateImage) to zig-out/zeron-macos[-light].png and
  # exits 0, or prints `FAIL: zeron smoke: <reason>` (no frames within the
  # watchdog, capture error, blank image) and exits 1.
  # Intel runner: Apple Silicon runners expose no Metal device.
  zeron-app:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build zeron (ReleaseSafe)
        run: zig build zeron -Doptimize=ReleaseSafe --summary all
      - name: Smoke test zeron, dark (60 frames, reference fixtures)
        timeout-minutes: 5
        run: ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --dark
      - name: Smoke test zeron, light (60 frames, reference fixtures)
        timeout-minutes: 5
        run: ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --light
      # Browser pane: a WKWebView native child view (zpui native views + overlay plane)
      # loading a local page. http, not file://: the browser only navigates http(s)
      # (zeron's policy), so the page is served from a throwaway local server.
      - name: Smoke test zeron browser pane (WKWebView on a local page)
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          printf '%s' '<!doctype html><title>zeron smoke</title><body style="margin:0;padding:32px;font:24px -apple-system,sans-serif;background:linear-gradient(135deg,#fde68a,#93c5fd)"><h1>Hello from WKWebView</h1><p>Rendered as a native child view of the zpui window.</p></body>' > "$RUNNER_TEMP/site/index.html"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > "$RUNNER_TEMP/http.log" 2>&1 &
          sleep 1
          ZERON_SMOKE_BROWSER_URL=http://127.0.0.1:8765/ ZERON_SMOKE_OUT=zig-out/zeron-macos-browser.png \
            ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 30 --dark
      # Frosted menus must blur what is beneath them. ZERON_SMOKE_MENU=1 paints
      # high-contrast stripes, opens a frosted floating card (the real menu chrome,
      # deferred like every menu) over them and compares the stripes' high-frequency
      # energy under the card with and without it (FAIL: "frosted menu is not
      # blurred" unless it drops below 25%). Two paths: no native views (the card
      # is drawn on the main Metal layer), and with a WKWebView open (the card is on
      # the overlay plane above it, where the blur must sample the planes beneath;
      # this also reads the overlay plane back and requires an opaque backdrop).
      # Without MetalPerformanceShaders (paravirtual GPUs) the energy check prints
      # SKIP; the overlay-plane readback check still runs.
      - name: Smoke test zeron frosted menu blur (main plane)
        timeout-minutes: 5
        run: |
          ZERON_SMOKE_MENU=1 ZERON_SMOKE_OUT=zig-out/zeron-macos-menu.png \
            ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 30 --dark
      - name: Smoke test zeron frosted menu blur (overlay plane above a WKWebView)
        timeout-minutes: 5
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > "$RUNNER_TEMP/http-menu.log" 2>&1 &
          sleep 1
          ZERON_SMOKE_MENU=1 ZERON_SMOKE_BROWSER_URL=http://127.0.0.1:8765/ ZERON_SMOKE_OUT=zig-out/zeron-macos-menu-browser.png \
            ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 30 --dark
      # Settings pages with native AppKit controls (NSSwitch, NSPopUpButton, NSSlider)
      # hosted as native child views; captured for a visual check.
      - name: Smoke test zeron Settings with native controls (General, Appearance)
        timeout-minutes: 5
        shell: bash
        run: |
          for page in general appearance; do
            ZERON_SMOKE_SETTINGS=$page ZERON_SMOKE_OUT=zig-out/zeron-macos-settings-$page.png \
              ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 30 --dark
          done
      # [liquid-glass] macOS 15 has no NSGlassEffectView: forcing the Liquid Glass setting
      # must take the frosted fallback (no native glass views) and still render.
      - name: Smoke test zeron, Liquid Glass forced → frosted fallback (macOS 15)
        timeout-minutes: 5
        shell: bash
        run: |
          ZERON_LIQUID_GLASS=1 ZERON_SMOKE_OUT=zig-out/zeron-macos-liquid-fallback.png \
            ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --dark 2>&1 | tee "$RUNNER_TEMP/liquid.log"
          grep -q "liquid glass forced: unsupported, frosted fallback" "$RUNNER_TEMP/liquid.log" \
            || { echo "FAIL: expected the frosted fallback on macOS 15"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeron-macos
          path: zig-out/zeron-macos*.png
          if-no-files-found: warn

  # [liquid-glass] macOS 26 (Tahoe): native NSGlassEffectView. Intel image (Apple
  # Silicon runners expose no Metal device): build, the Liquid Glass unit tests, and a
  # smoke run with the setting forced that must report native glass. The window
  # capture (zig-out/zeron-macos26-liquid.png) is uploaded for a visual check.
  # [glass-lab] Plus evidence for flat-looking glass: environment diagnostics, the
  # zeron smoke with ZERON_SMOKE_DIAG=1 and the glass lab; all in artifact `glass-lab`.
  zeron-liquid-glass-macos26:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: macOS version
        run: sw_vers
      - name: Liquid Glass unit tests (zpui)
        run: zig build zpui-test -Dtest-filter=liquid -Dtest-filter=overlayPlane -Dtest-filter="native views" --summary all
      - name: Build zeron (ReleaseSafe)
        run: zig build zeron -Doptimize=ReleaseSafe --summary all
      # Environment evidence for "why does the glass look flat": display accommodations
      # (Reduce Transparency / Increase Contrast make AppKit draw glass solid), the GPU /
      # display WindowServer composites with, and the desktop behind the window.
      - name: Glass environment diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p zig-out/glass-lab
          {
            echo "== sw_vers"; sw_vers
            for k in reduceTransparency increaseContrast differentiateWithoutColor reduceMotion; do
              printf 'defaults read com.apple.universalaccess %s: ' "$k"
              defaults read com.apple.universalaccess "$k" 2>&1 || true
            done
            echo "== defaults read com.apple.universalaccess"; defaults read com.apple.universalaccess 2>&1 || true
            printf 'AppleInterfaceStyle: '; defaults read -g AppleInterfaceStyle 2>&1 || true
            printf 'AppleReduceDesktopTinting: '; defaults read -g AppleReduceDesktopTinting 2>&1 || true
            echo "== system_profiler SPDisplaysDataType"; system_profiler SPDisplaysDataType 2>&1 || true
            echo "== desktop picture"; osascript -e 'tell application "System Events" to get picture of every desktop' 2>&1 || true
          } | tee zig-out/glass-lab/environment.log
      # [liquid-glass] CI images run with Reduce Transparency on, so AppKit draws every
      # glass (and the window material) solid. Try to switch it off for the captures;
      # the app's `accessibility reduceTransparency=` log line says whether it took.
      # Never fails the job (the domain is TCC-protected on recent macOS).
      - name: Try to disable Reduce Transparency for the captures
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          printf 'before: '; defaults read com.apple.universalaccess reduceTransparency 2>&1 || true
          defaults write com.apple.universalaccess reduceTransparency -bool false 2>&1 || echo "defaults write (user) failed"
          defaults -currentHost write com.apple.universalaccess reduceTransparency -bool false 2>&1 || echo "defaults -currentHost write failed"
          sudo defaults write com.apple.universalaccess reduceTransparency -bool false 2>&1 || echo "sudo defaults write failed"
          killall cfprefsd 2>/dev/null || true
          sleep 2
          printf 'after (user): '; defaults read com.apple.universalaccess reduceTransparency 2>&1 || true
          printf 'after (currentHost): '; defaults -currentHost read com.apple.universalaccess reduceTransparency 2>&1 || true
      - name: Smoke test zeron with native Liquid Glass (dark + light)
        timeout-minutes: 8
        shell: bash
        run: |
          for mode in dark light; do
            ZERON_LIQUID_GLASS=1 ZERON_SMOKE_DIAG=1 ZERON_SMOKE_OUT=zig-out/zeron-macos26-liquid-$mode.png \
              ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --$mode 2>&1 | tee "zig-out/glass-lab/zeron-liquid-$mode.log"
            grep -q "liquid glass forced: native (NSGlassEffectView)" "zig-out/glass-lab/zeron-liquid-$mode.log" \
              || { echo "FAIL: macOS 26 did not report native Liquid Glass"; exit 1; }
            if grep -q "reduceTransparency=false" "zig-out/glass-lab/zeron-liquid-$mode.log"; then
              echo "Reduce Transparency is OFF in the app: the $mode capture shows real glass"
            else
              echo "::notice::Reduce Transparency still on in the app ($mode): glass captures are solid by design"
            fi
          done
      # [liquid-glass] The sidebar recipes side by side (ZERON_SIDEBAR_GLASS=glass|vev) and
      # the macOS 27 flush layout; Liquid Glass is the default here (no ZERON_LIQUID_GLASS).
      - name: Smoke test zeron Liquid Glass sidebar variants (default glass mode)
        if: always()
        timeout-minutes: 8
        shell: bash
        run: |
          for v in glass:floating vev:floating glass:flush; do
            m=${v%%:*}; lay=${v##*:}
            ZERON_SIDEBAR_GLASS=$m ZERON_SIDEBAR_LAYOUT=$lay ZERON_SMOKE_OUT=zig-out/zeron-macos26-sidebar-$m-$lay.png \
              ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --dark 2>&1 | tee "zig-out/glass-lab/zeron-sidebar-$m-$lay.log" || true
            grep -q "liquid glass on (macOS" "zig-out/glass-lab/zeron-sidebar-$m-$lay.log" \
              || echo "::warning::Liquid Glass was not the default ($m/$lay)"
          done
      # [glass-lab] The glass lab (apps/zeron/src/glass_lab.zig): glass panels over striped,
      # moving content plus AppKit reference views, captured four ways (window alone,
      # display rect, whole display, screencapture -x) next to a readback of zpui's Metal
      # planes, with per-panel numbers and the layer-tree dump in the logs.
      - name: Glass lab (opaque light, opaque dark, blurred light)
        if: always()
        timeout-minutes: 8
        shell: bash
        run: |
          for v in opaque:light opaque:dark blurred:light; do
            bg=${v%%:*}; mode=${v##*:}
            ZERON_GLASS_LAB=1 ZERON_GLASS_LAB_BG=$bg ZERON_GLASS_LAB_OUT=zig-out/glass-lab \
              ./zig-out/bin/zeron --smoke-frames 90 --$mode 2>&1 | tee "zig-out/glass-lab/lab-$bg-$mode.log" || true
          done
          echo "== per-panel numbers"; grep -h "glass lab: " zig-out/glass-lab/lab-*.log | grep -E "panel|sd|p-|ctl|group" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeron-macos26-liquid-glass
          path: zig-out/zeron-macos26*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-lab
          path: |
            zig-out/glass-lab/
            zig-out/zeron-macos26*.png
          if-no-files-found: warn

  # [liquid-glass] macOS 27 (Golden Gate) on the `xcode-27` image (arm64, public
  # preview, no MPS and no real Metal device): build, unit tests, the Mach-O stamp
  # (sdk 27.0: AppKit's macOS 27 linked-on behaviours; minos 12.0 for the bundle
  # target) and the Liquid Glass gate (must report native glass, macOS 27). The smoke
  # launch is informational only (no GPU assertions). Preview label: never blocks CI.
  zeron-macos27:
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: macOS / Xcode / SDK versions
        run: |
          sw_vers
          xcodebuild -version || true
          xcrun --sdk macosx --show-sdk-version || true
      - name: Unit tests (zpui, zeron app)
        run: |
          zig build zpui-test --summary all
          zig build zeron-app-test --summary all
      - name: Build zeron (native, ReleaseSafe)
        run: zig build zeron -Doptimize=ReleaseSafe --summary all
      - name: LC_BUILD_VERSION (native build)
        shell: bash
        run: |
          vtool -show-build zig-out/bin/zeron || true
          otool -l zig-out/bin/zeron | grep -A5 LC_BUILD_VERSION || true
          python3 apps/zeron/scripts/macho-build-version.py --expect-sdk 27.0 zig-out/bin/zeron
      - name: Liquid Glass gate (macOS 27) + smoke launch (no GPU assertions)
        timeout-minutes: 5
        shell: bash
        run: |
          ZERON_LIQUID_GLASS=1 ZERON_SMOKE_OUT=zig-out/zeron-macos27-liquid.png \
            ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 30 --dark 2>&1 | tee "$RUNNER_TEMP/m27.log" \
            || echo "smoke exited non-zero (informational on the paravirtual GPU)"
          grep -q "liquid glass forced: native (NSGlassEffectView)" "$RUNNER_TEMP/m27.log" \
            || { echo "FAIL: macOS 27 did not report native Liquid Glass"; exit 1; }
          grep -q "liquid glass on (macOS 27)" "$RUNNER_TEMP/m27.log" \
            || { echo "FAIL: the Liquid Glass revision is not 27"; exit 1; }
      - name: Bundle target (aarch64-macos.12.0) stamps minos 12.0 / sdk 27.0
        shell: bash
        run: |
          zig build zeron -Doptimize=ReleaseSafe -Dtarget=aarch64-macos.12.0 -Dmacos-sdk="$(xcrun --sdk macosx --show-sdk-path)" --summary all
          vtool -show-build zig-out/bin/zeron || true
          python3 apps/zeron/scripts/macho-build-version.py --expect-sdk 27.0 --expect-minos 12.0 zig-out/bin/zeron
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeron-macos27
          path: zig-out/zeron-macos27*.png
          if-no-files-found: ignore

  # Same smoke test on Linux: Xvfb (X11, server decorations) + Vulkan lavapipe.
  # The window is captured with ImageMagick `import` (zig-out/zeron-linux[-light].png).
  # Also packages the Linux tarball (`zig build zeron-dist`).
  zeron-app-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install Linux dependencies (+ Xvfb, ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS xvfb xauth imagemagick
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - name: Build zeron (ReleaseSafe)
        run: zig build zeron -Doptimize=ReleaseSafe --summary all
      - name: Smoke test zeron, dark (60 frames, reference fixtures, Xvfb + lavapipe)
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1600x1000x24 -nolisten tcp" ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --dark
      - name: Smoke test zeron, light (60 frames, reference fixtures, Xvfb + lavapipe)
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1600x1000x24 -nolisten tcp" ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --light
      - name: Smoke test zeron frosted menu blur (Xvfb + lavapipe)
        timeout-minutes: 5
        run: ZERON_SMOKE_MENU=1 ZERON_SMOKE_OUT=zig-out/zeron-linux-menu.png xvfb-run -a -s "-screen 0 1600x1000x24 -nolisten tcp" ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 30 --dark
      - name: zeron engine pin (tools/upstream/map.json)
        id: pin
        run: echo "sha=$(python3 -c 'import json; print(json.load(open("tools/upstream/map.json"))["upstreams"]["zeron"]["pinned"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: zeronsh/zeron
          ref: ${{ steps.pin.outputs.sha }}
          path: zeron-src
          fetch-depth: 1
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeron-src -> target
          shared-key: zeron-engine-linux
          cache-on-failure: true
      - name: Package Linux tarball (zig build zeron-dist; engine included)
        env:
          ZERON_SRC: ${{ github.workspace }}/zeron-src
          ZERON_REQUIRE_ENGINE: "1"
          CARGO_TARGET_DIR: ${{ github.workspace }}/zeron-src/target
        run: zig build zeron-dist -Doptimize=ReleaseSafe --summary all
      - name: Verify the tarball's engine (spawned by the client's discovery, serves it)
        timeout-minutes: 5
        run: |
          tgz=$(ls zig-out/zeron-*-linux-*.tar.gz)
          dir=$(mktemp -d); tar -xzf "$tgz" -C "$dir"; eng=$(ls "$dir"/*/zeron-engine)
          "$eng" --version
          data=$(mktemp -d)
          zig build probe -- --zeron "$eng" --data-dir "$data" --port 27991 --seconds 2 2>&1 | tee "$RUNNER_TEMP/probe.log"
          grep -q "spawned=true" "$RUNNER_TEMP/probe.log" || { echo "FAIL: probe did not spawn and reach the engine"; exit 1; }
          grep -q "chat(s)" "$RUNNER_TEMP/probe.log" || { echo "FAIL: WatchChats did not answer"; exit 1; }
          test -f "$data/engine.lock" || { echo "FAIL: engine never took its data dir lock"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeron-linux
          path: zig-out/zeron-linux*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: zeron-linux-dist
          path: zig-out/zeron-*-linux-*.tar.gz
          if-no-files-found: error

  # macOS packaging: Zeron.app with a universal (arm64 + x86_64) binary, built
  # per arch then merged with lipo by `zig build zeron-app-bundle`. Apple Silicon
  # has no Metal device on CI, so the bundle is checked structurally and by
  # running its binary (`zeron headless` must refuse with exit 2: proves the
  # arm64 slice loads its frameworks), not rendered.
  zeron-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: zeron engine pin (tools/upstream/map.json)
        id: pin
        run: echo "sha=$(python3 -c 'import json; print(json.load(open("tools/upstream/map.json"))["upstreams"]["zeron"]["pinned"])')" >> "$GITHUB_OUTPUT"
      # The engine bundled as Zeron.app/Contents/Helpers/zeron-engine is built from the
      # exact zeron commit the client was ported against (bumping the pin bumps it).
      - uses: actions/checkout@v4
        with:
          repository: zeronsh/zeron
          ref: ${{ steps.pin.outputs.sha }}
          path: zeron-src
          fetch-depth: 1
          persist-credentials: false
      - name: Rust targets (aarch64 + x86_64 macOS)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeron-src -> target
          shared-key: zeron-engine-macos
          cache-on-failure: true
      - name: Build Zeron.app (x86_64, then aarch64 + lipo → universal; engine included)
        env:
          ZERON_SRC: ${{ github.workspace }}/zeron-src
          ZERON_REQUIRE_ENGINE: "1"
          CARGO_TARGET_DIR: ${{ github.workspace }}/zeron-src/target
        run: |
          # [liquid-glass] minos 12.0 = Info.plist LSMinimumSystemVersion (the Rust app's);
          # Zig 0.17 stamps sdk 27.0 (its bundled SDKSettings.json): the full 26/27 design.
          zig build zeron-app-bundle -Doptimize=ReleaseSafe -Dtarget=x86_64-macos.12.0 -Dmacos-sdk="$(xcrun --sdk macosx --show-sdk-path)" --summary all
          zig build zeron-app-bundle -Doptimize=ReleaseSafe -Dtarget=aarch64-macos.12.0 -Dmacos-sdk="$(xcrun --sdk macosx --show-sdk-path)" --summary all
      - name: Verify bundle
        run: |
          app=zig-out/Zeron.app
          plutil -lint "$app/Contents/Info.plist"
          echo "bundle id: $(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")"
          echo "version:   $(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          test -s "$app/Contents/Resources/zeron.icns" || { echo "FAIL: zeron.icns missing"; exit 1; }
          lipo -info "$app/Contents/MacOS/zeron"
          for a in arm64 x86_64; do
            lipo "$app/Contents/MacOS/zeron" -verify_arch "$a" || { echo "FAIL: universal binary lacks $a"; exit 1; }
          done
          codesign --verify --verbose=2 "$app"
          vtool -show-build "$app/Contents/MacOS/zeron" || true
          python3 apps/zeron/scripts/macho-build-version.py --expect-sdk 27.0 --expect-minos 12.0 "$app/Contents/MacOS/zeron"
          set +e
          "$app/Contents/MacOS/zeron" headless; code=$?
          set -e
          if [ "$code" != 2 ]; then echo "FAIL: bundled zeron did not start (exit $code; expected the 'not the engine' refusal, 2)"; exit 1; fi
          echo "bundled binary starts (refused 'headless' as expected)"
      - name: Verify bundled engine (universal, minos 12.0, signed, starts and serves the client)
        timeout-minutes: 5
        run: |
          app=zig-out/Zeron.app
          eng=$app/Contents/Helpers/zeron-engine
          test -x "$eng" || { echo "FAIL: $eng missing"; exit 1; }
          lipo -info "$eng"
          for a in arm64 x86_64; do
            lipo "$eng" -verify_arch "$a" || { echo "FAIL: engine lacks $a"; exit 1; }
          done
          python3 apps/zeron/scripts/macho-build-version.py --expect-minos 12.0 "$eng"
          codesign --verify --strict --verbose=2 "$eng"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$eng" --version
          "$eng" --noop-browser https://example.invalid
          # x86_64 slice under Rosetta when available (informational).
          arch -x86_64 "$eng" --version || echo "(no Rosetta: x86_64 slice not run)"
          # The client's discovery + spawn path: zeron-probe resolves nothing itself, so
          # point it at the bundled engine, on a temp data dir and a private port, and
          # let it spawn `zeron-engine headless`, bootstrap (EngineInfo → EngineReady),
          # list chats, then stop the engine it started.
          data=$(mktemp -d)
          zig build probe -- --zeron "$PWD/$eng" --data-dir "$data" --port 27991 --seconds 2 2>&1 | tee "$RUNNER_TEMP/probe.log"
          grep -q "spawned=true" "$RUNNER_TEMP/probe.log" || { echo "FAIL: probe did not spawn and reach the bundled engine"; exit 1; }
          grep -q "chat(s)" "$RUNNER_TEMP/probe.log" || { echo "FAIL: WatchChats did not answer"; exit 1; }
          sleep 1
          if lsof -nP -iTCP:27991 -sTCP:LISTEN; then echo "FAIL: engine still listening after the probe stopped it"; exit 1; fi
          test -f "$data/engine.lock" || { echo "FAIL: engine never took its data dir lock"; exit 1; }
          ls "$data" "$data/logs" || true
          echo "bundled engine OK"
      - name: Zip Zeron.app
        run: ditto -c -k --keepParent zig-out/Zeron.app zig-out/Zeron-macos-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Zeron-macos-app
          path: zig-out/Zeron-macos-app.zip
          if-no-files-found: error
