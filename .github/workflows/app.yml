name: Build app

# Just the Zeron.app (universal, ReleaseSafe) as the Zeron-macos-app artifact: no tests.
# Plus `sf-symbols`: the shell and Settings captured with SF Symbols on (the macOS default)
# and off, as the zeron-macos-sf-symbols artifact.
# Run from the Actions tab (or `workflow_dispatch` via the API).
on:
  workflow_dispatch:

jobs:
  zeron-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: zeron engine pin (tools/upstream/map.json)
        id: pin
        run: echo "sha=$(python3 -c 'import json; print(json.load(open("tools/upstream/map.json"))["upstreams"]["zeron"]["pinned"])')" >> "$GITHUB_OUTPUT"
      # The engine bundled as Zeron.app/Contents/Helpers/zeron-engine is built from the
      # exact zeron commit the client was ported against (bumping the pin bumps it).
      - uses: actions/checkout@v4
        with:
          repository: zeronsh/zeron
          ref: ${{ steps.pin.outputs.sha }}
          path: zeron-src
          fetch-depth: 1
          persist-credentials: false
      - name: Rust targets (aarch64 + x86_64 macOS)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeron-src -> target
          shared-key: zeron-engine-macos
          cache-on-failure: true
      - name: Build Zeron.app (x86_64, then aarch64 + lipo → universal; engine included)
        env:
          ZERON_SRC: ${{ github.workspace }}/zeron-src
          ZERON_REQUIRE_ENGINE: "1"
          CARGO_TARGET_DIR: ${{ github.workspace }}/zeron-src/target
        run: |
          # [liquid-glass] minos 12.0 = Info.plist LSMinimumSystemVersion (the Rust app's);
          # Zig 0.17 stamps sdk 27.0 (its bundled SDKSettings.json): the full 26/27 design.
          zig build zeron-app-bundle -Doptimize=ReleaseSafe -Dtarget=x86_64-macos.12.0 -Dmacos-sdk="$(xcrun --sdk macosx --show-sdk-path)" --summary all
          zig build zeron-app-bundle -Doptimize=ReleaseSafe -Dtarget=aarch64-macos.12.0 -Dmacos-sdk="$(xcrun --sdk macosx --show-sdk-path)" --summary all
      - name: Verify bundle
        run: |
          app=zig-out/Zeron.app
          plutil -lint "$app/Contents/Info.plist"
          echo "bundle id: $(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")"
          echo "version:   $(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          test -s "$app/Contents/Resources/zeron.icns" || { echo "FAIL: zeron.icns missing"; exit 1; }
          lipo -info "$app/Contents/MacOS/zeron"
          for a in arm64 x86_64; do
            lipo "$app/Contents/MacOS/zeron" -verify_arch "$a" || { echo "FAIL: universal binary lacks $a"; exit 1; }
          done
          codesign --verify --verbose=2 "$app"
          vtool -show-build "$app/Contents/MacOS/zeron" || true
          python3 apps/zeron/scripts/macho-build-version.py --expect-sdk 27.0 --expect-minos 12.0 "$app/Contents/MacOS/zeron"
          set +e
          "$app/Contents/MacOS/zeron" headless; code=$?
          set -e
          if [ "$code" != 2 ]; then echo "FAIL: bundled zeron did not start (exit $code; expected the 'not the engine' refusal, 2)"; exit 1; fi
          echo "bundled binary starts (refused 'headless' as expected)"
      - name: Verify bundled engine (universal, minos 12.0, signed, starts and serves the client)
        timeout-minutes: 5
        run: |
          app=zig-out/Zeron.app
          eng=$app/Contents/Helpers/zeron-engine
          test -x "$eng" || { echo "FAIL: $eng missing"; exit 1; }
          lipo -info "$eng"
          for a in arm64 x86_64; do
            lipo "$eng" -verify_arch "$a" || { echo "FAIL: engine lacks $a"; exit 1; }
          done
          python3 apps/zeron/scripts/macho-build-version.py --expect-minos 12.0 "$eng"
          codesign --verify --strict --verbose=2 "$eng"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$eng" --version
          "$eng" --noop-browser https://example.invalid
          # x86_64 slice under Rosetta when available (informational).
          arch -x86_64 "$eng" --version || echo "(no Rosetta: x86_64 slice not run)"
          # The client's discovery + spawn path: zeron-probe resolves nothing itself, so
          # point it at the bundled engine, on a temp data dir and a private port, and
          # let it spawn `zeron-engine headless`, bootstrap (EngineInfo → EngineReady),
          # list chats, then stop the engine it started.
          data=$(mktemp -d)
          zig build probe -- --zeron "$PWD/$eng" --data-dir "$data" --port 27991 --seconds 2 2>&1 | tee "$RUNNER_TEMP/probe.log"
          grep -q "spawned=true" "$RUNNER_TEMP/probe.log" || { echo "FAIL: probe did not spawn and reach the bundled engine"; exit 1; }
          grep -q "chat(s)" "$RUNNER_TEMP/probe.log" || { echo "FAIL: WatchChats did not answer"; exit 1; }
          sleep 1
          if lsof -nP -iTCP:27991 -sTCP:LISTEN; then echo "FAIL: engine still listening after the probe stopped it"; exit 1; fi
          test -f "$data/engine.lock" || { echo "FAIL: engine never took its data dir lock"; exit 1; }
          ls "$data" "$data/logs" || true
          echo "bundled engine OK"
      - name: Zip Zeron.app
        run: ditto -c -k --keepParent zig-out/Zeron.app zig-out/Zeron-macos-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Zeron-macos-app
          path: zig-out/Zeron-macos-app.zip
          if-no-files-found: error

  # Settings → Appearance → Use SF Symbols (docs/SF_SYMBOLS.md): the shell and Settings
  # (Appearance, General) from the reference fixtures with symbols on, dark and light, plus
  # the same views with symbols off (sf-symbols.json {"enabled":false} through
  # ZERON_FIXTURE_SETTINGS_DIR) for comparison. On and off must differ, or the symbols
  # never reached the screen. Intel runner: Apple Silicon runners expose no Metal device.
  sf-symbols:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build zeron (ReleaseSafe)
        run: zig build zeron -Doptimize=ReleaseSafe --summary all
      - name: Capture shell and Settings with SF Symbols on and off
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p zig-out/sf-symbols
          for state in on off; do
            dir="$RUNNER_TEMP/sf-$state"
            mkdir -p "$dir"
            if [ "$state" = on ]; then v=true; else v=false; fi
            printf '{"enabled":%s}' "$v" > "$dir/sf-symbols.json"
            for mode in dark light; do
              ZERON_FIXTURE_SETTINGS_DIR="$dir" ZERON_SMOKE_OUT=zig-out/sf-symbols/shell-$state-$mode.png \
                ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 60 --$mode 2>&1 | tee -a "$RUNNER_TEMP/sf-$state.log"
              for page in appearance general; do
                ZERON_FIXTURE_SETTINGS_DIR="$dir" ZERON_SMOKE_SETTINGS=$page ZERON_SMOKE_OUT=zig-out/sf-symbols/settings-$page-$state-$mode.png \
                  ./zig-out/bin/zeron --fixtures apps/zeron/fixtures/reference --smoke-frames 40 --$mode 2>&1 | tee -a "$RUNNER_TEMP/sf-$state.log"
              done
            done
          done
          grep -h "SF Symbols: rendered" "$RUNNER_TEMP/sf-on.log" | head -3 || echo "::warning::no 'SF Symbols: rendered' log line (log level?)"
          if grep -q "SF Symbols: rendered" "$RUNNER_TEMP/sf-off.log"; then echo "FAIL: symbols rendered with the setting off"; exit 1; fi
          for f in zig-out/sf-symbols/*-on-*.png; do
            g="${f/-on-/-off-}"
            if cmp -s "$f" "$g"; then echo "FAIL: $f is identical to $g (symbols not drawn)"; exit 1; fi
            echo "differs: $(basename "$f") vs $(basename "$g")"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeron-macos-sf-symbols
          path: zig-out/sf-symbols/*.png
          if-no-files-found: warn
